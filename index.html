
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GA Games - Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .coming-soon {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 2px;
      color: #2563eb;
      font-size: clamp(25px, 7vw, 58px);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .coming-soon span {
      display: inline-block;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .coming-soon span:nth-child(1)  { animation-delay: 0s; }
    .coming-soon span:nth-child(2)  { animation-delay: 0.08s; }
    .coming-soon span:nth-child(3)  { animation-delay: 0.16s; }
    .coming-soon span:nth-child(4)  { animation-delay: 0.24s; }
    .coming-soon span:nth-child(5)  { animation-delay: 0.32s; }
    .coming-soon span:nth-child(6)  { animation-delay: 0.40s; }
    .coming-soon span:nth-child(7)  { animation-delay: 0.48s; }
    .coming-soon span:nth-child(8)  { animation-delay: 0.56s; }
    .coming-soon span:nth-child(9)  { animation-delay: 0.64s; }
    .coming-soon span:nth-child(10) { animation-delay: 0.72s; }
    .coming-soon span:nth-child(11) { animation-delay: 0.80s; }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-15px);
      }
    }
  </style>
</head>

<body>
  <div class="coming-soon">
    <span>C</span>
    <span>o</span>
    <span>m</span>
    <span>i</span>
    <span>n</span>
    <span>g</span>
    <span>&nbsp;</span>
    <span>S</span>
    <span>o</span>
    <span>o</span>
    <span>n</span>
  </div>
</body>
</html>
