
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>GA Games - Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .content {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .coming-soon {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 2px;
      color: #21769D;
      font-size: clamp(28px, 7vw, 58px);
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .coming-soon span {
      display: inline-block;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .coming-soon span:nth-child(1)  { animation-delay: 0s; }
    .coming-soon span:nth-child(2)  { animation-delay: 0.08s; }
    .coming-soon span:nth-child(3)  { animation-delay: 0.16s; }
    .coming-soon span:nth-child(4)  { animation-delay: 0.24s; }
    .coming-soon span:nth-child(5)  { animation-delay: 0.32s; }
    .coming-soon span:nth-child(6)  { animation-delay: 0.40s; }
    .coming-soon span:nth-child(7)  { animation-delay: 0.48s; }
    .coming-soon span:nth-child(8)  { animation-delay: 0.56s; }
    .coming-soon span:nth-child(9)  { animation-delay: 0.64s; }
    .coming-soon span:nth-child(10) { animation-delay: 0.72s; }
    .coming-soon span:nth-child(11) { animation-delay: 0.80s; }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-18px);
      }
    }

    .description {
      font-size: 16px;
      line-height: 1.8;
      color: #64748b;
      max-width: 480px;
      margin: 0 auto;
    }

    @media (max-width: 480px) {
      .description {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="content">

    <div class="coming-soon">
      <span>C</span>
      <span>o</span>
      <span>m</span>
      <span>i</span>
      <span>n</span>
      <span>g</span>
      <span>&nbsp;</span>
      <span>S</span>
      <span>o</span>
      <span>o</span>
      <span>n</span>
    </div>

    <p class="description">
      Get ready for a new experience from GA Demands.
      We're working on something exciting.
      Stay tuned!
    </p>

  </main>

</body>
</html>
